<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pinkArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF1E6D" />
      <stop offset="50%" stopColor="#FF2E7E" />
      <stop offset="100%" stopColor="#E60067" />
    </linearGradient>
    
    <linearGradient id="whiteTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>

    <linearGradient id="whiteBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>

    <linearGradient id="arrowBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0062FF" />
      <stop offset="60%" stopColor="#0091FF" />
      <stop offset="100%" stopColor="#00D2FF" />
    </linearGradient>

    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFD700" />
      <stop offset="100%" stopColor="#FF9900" />
    </linearGradient>

    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF1E6D" flood-opacity="0.35" />
    </filter>
    
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ==================== TOP EMBLEM ==================== -->
  <g transform="translate(600, 220)">
    
    <!-- Outer Scalloped Jharokha Arch in Jaipur Neon Pink -->
    <path
      d="M 0 -185
         C 8 -185, 18 -170, 25 -160
         C 45 -135, 75 -145, 95 -125
         C 115 -125, 135 -100, 150 -75
         C 165 -45, 160 -15, 160 25
         C 130 25, 120 35, 120 35
         L -120 35
         C -120 35, -130 25, -160 25
         C -160 -15, -165 -45, -150 -75
         C -135 -100, -115 -125, -95 -125
         C -75 -145, -45 -135, -25 -160
         C -18 -170, -8 -185, 0 -185 Z"
      fill="none"
      stroke="url(#pinkArchGrad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#pinkGlow)"
    />

    <!-- Decorative Accent Pink Squares -->
    <rect x="-85" y="-65" width="14" height="14" fill="#FF1E6D" rx="3" />
    <rect x="71" y="-65" width="14" height="14" fill="#FF1E6D" rx="3" />
    <rect x="-140" y="-10" width="14" height="14" fill="#FF1E6D" rx="3" />
    <rect x="126" y="-10" width="14" height="14" fill="#FF1E6D" rx="3" />

    <!-- Left & Right Royal Base Minarets / Domes (White/Silver Architectural Silhouettes) -->
    <!-- Left Minaret Outline -->
    <path
      d="M -155 35 L -155 15 C -155 0, -135 -10, -130 -20 L -115 -20 C -110 -10, -90 0, -90 15 L -90 35 Z"
      fill="rgba(255,255,255,0.06)"
      stroke="rgba(255,255,255,0.3)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <line x1="-122.5" y1="-20" x2="-122.5" y2="-35" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Right Minaret Outline -->
    <path
      d="M 90 35 L 90 15 C 90 0, 110 -10, 115 -20 L 130 -20 C 135 -10, 155 0, 155 15 L 155 35 Z"
      fill="rgba(255,255,255,0.06)"
      stroke="rgba(255,255,255,0.3)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <line x1="122.5" y1="-20" x2="122.5" y2="-35" stroke="rgba(255,255,255,0.4)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Dome & Gold 8-Point Star / Kalash -->
    <path d="M -18 35 C -18 15, 18 15, 18 35 Z" fill="#FF1E6D" />
    <path
      d="M 0 -8 L 6 4 L 18 10 L 6 16 L 0 28 L -6 16 L -18 10 L -6 4 Z"
      fill="url(#goldStarGrad)"
    />

    <!-- Circuitry Pathways & Electronic Nodes -->
    <!-- Central Main Line & Gold Terminal -->
    <circle cx="0" cy="-120" r="16" fill="url(#goldStarGrad)" stroke="#FFFFFF" stroke-width="3" />
    <line x1="0" y1="-104" x2="0" y2="-15" stroke="#0066FF" stroke-width="10" stroke-linecap="round" filter="url(#blueGlow)" />

    <!-- Inner Blue Nodes & Lines -->
    <circle cx="-38" cy="-83" r="13" fill="#0066FF" />
    <path d="M -38 -70 L -38 -27 L -15 -8" fill="none" stroke="#0066FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="38" cy="-83" r="13" fill="#0066FF" />
    <path d="M 38 -70 L 38 -27 L 15 -8" fill="none" stroke="#0066FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Outer Left Branch with Magenta node -->
    <circle cx="-95" cy="-25" r="14" fill="#FF1E6D" />
    <path d="M -95 -11 L -95 35 L -50 35 L -50 -5 L 0 -5" fill="none" stroke="#0066FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Outer Right Branch with Blue node -->
    <circle cx="95" cy="-25" r="14" fill="#0066FF" />
    <path d="M 95 -11 L 95 35 L 50 35 L 50 -5 L 0 -5" fill="none" stroke="#0066FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Base Connector Horizontal Bar -->
    <line x1="-165" y1="35" x2="165" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- ==================== MAIN SEO TYPOGRAPHY ==================== -->
  <g transform="translate(600, 480)">
    
    <!-- LETTER 'S' -->
    <!-- 3D Bevel Soft Silver Base -->
    <path
      d="M -350 -120 L -215 -120 L -215 -72 L -285 -72 C -300 -72, -305 -65, -305 -50 C -305 -35, -295 -28, -275 -22 L -230 -10 C -185 2, -165 25, -165 70 C -165 125, -205 145, -270 145 L -410 145 L -410 95 L -335 95 C -315 95, -305 88, -305 75 C -305 60, -315 52, -335 48 L -380 35 C -425 22, -445 -2, -445 -48 C -445 -105, -405 -120, -350 -120 Z"
      fill="#E2E8F0"
      opacity="0.85"
    />
    <!-- Pure White Front Face -->
    <path
      d="M -350 -130 L -220 -130 L -220 -82 L -290 -82 C -305 -82, -312 -75, -312 -60 C -312 -45, -300 -38, -280 -32 L -235 -20 C -190 -8, -170 15, -170 60 C -170 115, -210 135, -275 135 L -410 135 L -410 85 L -335 85 C -315 85, -305 78, -305 65 C -305 50, -318 42, -338 38 L -383 25 C -428 12, -448 -12, -448 -58 C -448 -115, -408 -130, -350 -130 Z"
      fill="url(#whiteTextGrad)"
    />

    <!-- LETTER 'E' -->
    <!-- 3D Bevel Soft Silver Base -->
    <path
      d="M -145 -120 L 55 -120 L 55 -72 L -75 -72 L -75 -20 L 35 -20 L 35 25 L -75 25 L -75 95 L 60 95 L 60 145 L -145 145 Z"
      fill="#E2E8F0"
      opacity="0.85"
    />
    <!-- Pure White Front Face -->
    <path
      d="M -145 -130 L 55 -130 L 55 -82 L -75 -82 L -75 -30 L 35 -30 L 35 15 L -75 15 L -75 85 L 60 85 L 60 135 L -145 135 Z"
      fill="url(#whiteTextGrad)"
    />

    <!-- LETTER 'O' WITH INTEGRATED GROWTH CHART & SWOOPING ARROW -->
    <g transform="translate(250, 5)">
      <!-- Outer White/Silver O Ring Base -->
      <circle cx="0" cy="0" r="135" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="10" />
      <circle cx="0" cy="0" r="75" fill="#0A0815" />

      <!-- Bar Chart Inside O -->
      <!-- Bar 1 (Light Blue) -->
      <rect x="-48" y="10" width="22" height="40" rx="4" fill="#00D2FF" />
      <!-- Bar 2 (Jaipur Pink) -->
      <rect x="-16" y="-20" width="22" height="70" rx="4" fill="#FF1E6D" />
      <!-- Bar 3 (Deep Navy Blue) -->
      <rect x="16" y="-50" width="22" height="100" rx="4" fill="#0055FF" />

      <!-- White Curved Arc Track under the arrow -->
      <path
        d="M -115 85 C -50 95, 35 60, 110 -25"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="16"
        stroke-linecap="round"
      />

      <!-- Swooping Upward Blue Arrow -->
      <!-- Arrow Trail -->
      <path
        d="M -125 78 C -55 90, 30 55, 115 -35"
        fill="none"
        stroke="url(#arrowBlueGrad)"
        stroke-width="13"
        stroke-linecap="round"
      />

      <!-- 3D Arrow Head (Pointing Up-Right) -->
      <path
        d="M 90 -65 L 175 -95 L 145 -10 L 125 -38 Z"
        fill="url(#arrowBlueGrad)"
        filter="url(#blueGlow)"
      />
      <!-- Arrow Head Edge Highlight -->
      <path
        d="M 90 -65 L 175 -95 L 145 -10 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
    </g>

  </g>

  <!-- ==================== SUBTITLE: — IN JAIPUR — ==================== -->
  <g transform="translate(600, 705)">
    <!-- Left Pink Line -->
    <line x1="-390" y1="-8" x2="-230" y2="-8" stroke="#FF1E6D" stroke-width="10" stroke-linecap="round" filter="url(#pinkGlow)" />
    
    <!-- 'IN' in Pure White -->
    <text
      x="-195"
      y="12"
      font-family="'Space Grotesk', 'Montserrat', sans-serif"
      font-weight="900"
      font-size="64"
      fill="#FFFFFF"
      letter-spacing="12"
      text-anchor="start"
    >IN</text>

    <!-- 'JAIPUR' in Jaipur Neon Pink -->
    <text
      x="-60"
      y="12"
      font-family="'Space Grotesk', 'Montserrat', sans-serif"
      font-weight="900"
      font-size="64"
      fill="#FF1E6D"
      letter-spacing="14"
      text-anchor="start"
      filter="url(#pinkGlow)"
    >JAIPUR</text>

    <!-- Right Pink Line -->
    <line x1="230" y1="-8" x2="390" y2="-8" stroke="#FF1E6D" stroke-width="10" stroke-linecap="round" filter="url(#pinkGlow)" />
  </g>

</svg>
