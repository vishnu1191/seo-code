name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create static route pages for SEO
        run: |
          node --input-type=module <<'NODE'
          import { readFile, mkdir, copyFile } from 'node:fs/promises';

          const source = await readFile('src/data/blogPosts.ts', 'utf8');
          const slugs = [...source.matchAll(/slug:\s*'([^']+)'/g)].map((match) => match[1]);
          const routes = [
            'about', 'services', 'performance', 'work', 'process',
            'calculator', 'blog',
            ...slugs.map((slug) => `blog/${slug}`)
          ];

          for (const route of routes) {
            const destination = `dist/${route}`;
            await mkdir(destination, { recursive: true });
            await copyFile('dist/index.html', `${destination}/index.html`);
          }

          console.log(`Generated ${routes.length} static routes, including ${slugs.length} blog posts.`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
